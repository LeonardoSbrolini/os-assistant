name: build

# Push em main: compila, testa e, se a <Version> do Assistente.App.csproj ainda não
# tiver release, publica a release "vX.Y.Z" que o app usa para se atualizar sozinho.
# Ou seja: para lançar uma versão nova, basta aumentar a <Version> e fazer push em main.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testes
        run: dotnet test tests/Assistente.Core.Tests -c Release

      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') }
               else { ([xml](Get-Content src/Assistente.App/Assistente.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" 2>$null
          $publish = ($LASTEXITCODE -ne 0) -and ($env:GITHUB_EVENT_NAME -ne 'pull_request') -and ($env:GITHUB_REF -eq 'refs/heads/main' -or $env:GITHUB_REF -like 'refs/tags/v*')
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Versão $v · publicar release: $publish"
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publicar (completo e leve)
        shell: pwsh
        run: |
          $common = @('src/Assistente.App/Assistente.App.csproj', '-c', 'Release', '-r', 'win-x64',
                      '-p:PublishSingleFile=true', '-p:DebugType=none',
                      "-p:Version=${{ steps.ver.outputs.version }}",
                      "-p:UpdateRepository=${{ github.repository }}")
          dotnet publish @common --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/full
          dotnet publish @common --self-contained false -o out/light
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/full/Assistente.exe release/Assistente.exe
          Copy-Item out/light/Assistente.exe release/Assistente-leve.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Assistente
          path: release/*.exe

      - name: Criar release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.ver.outputs.version }}" release/Assistente.exe release/Assistente-leve.exe --target "${{ github.sha }}" --title "Assistente v${{ steps.ver.outputs.version }}" --generate-notes
